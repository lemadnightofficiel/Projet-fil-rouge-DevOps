services:
  # ─── BASE DE DONNÉES ───────────────────────────────────────────
  db:
    build:
      context: ./bdd
    container_name: bdd
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASENAME}
      MYSQL_USER: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_USER_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./bdd/data:/docker-entrypoint-initdb.d:ro
    networks:
      - backend

  # ─── API ───────────────────────────────────────────────────────
  api:
    build:
      context: ./src-api
    container_name: api
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080/
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__MariaDbConnectionString: ${MARIADB_CONNECTIONSTRING}
    ports:
      - "3120:8080"
    networks:
      - backend
      - frontend
    depends_on:
      - db

  # ─── FRONT ─────────────────────────────────────────────────────
  front:
    build:
      context: ./src-front/weathercast
      args:
        GIT_REVISION: ${GIT_REVISION:-dev}
    container_name: front
    restart: unless-stopped
    environment:
      API_URL: http://api:8080/api/weathers
    ports:
      - "5057:8000"
    networks:
      - frontend
    depends_on:
      - api

volumes:
  db_data:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge